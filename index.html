<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Diop Chop</title><script src="https://sdk.minepi.com/pi-sdk.js"></script></head><body style="text-align:center;padding:20px;background:#fdf6e3;font-family:sans-serif"><div style="background:white;padding:20px;border-radius:15px;max-width:360px;margin:auto"><h2>☕ Diop Chop Touba</h2><p id="status" style="color:blue">v16 - Test Fix</p><button id="btn" style="width:100%;padding:16px;background:#8B4513;color:white;border:none;border-radius:10px;font-weight:bold;font-size:18px">PAYER EN PI</button><p id="msg" style="font-weight:bold;margin-top:15px"></p></div><script>
const API_KEY="b9cdzr1x1if7nsqpuqucvktowkbldayqgrfrhfq59yoyrf0iii7ner03hzf3ddbn";
function log(t){document.getElementById("msg").innerText=t; console.log(t);}
document.getElementById("btn").onclick=async()=>{
  if(typeof Pi==="undefined"){ log("❌ Ouvre dans Pi Browser!"); return; }
  try{
    Pi.init({version:"2.0",sandbox:true});
    log("Connexion...");
    const auth=await Pi.authenticate(['username','payments'],()=>{});
    log("Connecté "+auth.user.username);
    await Pi.createPayment({amount:0.1,memo:"Diop Chop Test",metadata:{test:1}},{
      onReadyForServerApproval: async function(pid){
        log("Approuve "+pid+"...");
        const urls=[
          "https://api.testnet.minepi.com/v2/payments/"+pid+"/approve",
          "https://corsproxy.io/?https://api.testnet.minepi.com/v2/payments/"+pid+"/approve",
          "https://api.allorigins.win/raw?url=https://api.testnet.minepi.com/v2/payments/"+pid+"/approve"
        ];
        for(let u of urls){
          try{
            const r=await fetch(u,{method:"POST",headers:{"Authorization":"Key "+API_KEY}});
            if(r.ok){ log("✅ APPROUVÉ! Retourne wallet et glisse!"); return; }
          }catch(e){}
        }
        log("❌ Approve bloqué - régénère clé API dans develop.pi");
      },
      onReadyForServerCompletion: async function(pid,txid){
        log("Finalise...");
        await fetch("https://corsproxy.io/?https://api.testnet.minepi.com/v2/payments/"+pid+"/complete",{method:"POST",headers:{"Authorization":"Key "+API_KEY,"Content-Type":"application/json"},body:JSON.stringify({txid:txid})});
        log("✅✅ VALIDÉ! Checklist 10/10 ! Va voir develop.pi");
      },
      onCancel:()=>log("Annulé"),
      onError:(e)=>log("Erreur: "+e.message)
    });
  }catch(e){ log("Erreur: "+e.message); }
};
</script></body></html>
