<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIOP-CHOP PAIEMENT PI</title>
<script src="https://sdk.minepi.io/pi-sdk.js"></script>
</head>
<body style="font-family:Arial;text-align:center;padding:20px">
<h2>🍗 DIOP-CHOP Touba</h2>
<h3>Paiement Pi Testnet</h3>
<button id="payBtn" style="padding:15px 30px;font-size:18px;background:#8e44ad;color:white;border:none;border-radius:10px">PAYER 0.1 Pi TEST</button>
<p id="status"></p>
<script>
const WORKER_URL = "https://diop-chop-approve.diopmoustapha12133.workers.dev";
const Pi = window.Pi;
Pi.init({version:"2.0", sandbox:true});

async function callWorker(paymentId, action, txid){
  const r = await fetch(WORKER_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({paymentId, action, txid})
  });
  return await r.text();
}

document.getElementById("payBtn").onclick = async () => {
  try{
    document.getElementById("status").innerText = "Connexion Pi...";
    const payment = await Pi.createPayment({
      amount: 0.1,
      memo: "Commande DIOP-CHOP Touba",
      metadata: {orderId:"touba-"+Date.now()}
    }, {
      onReadyForServerApproval: async (paymentId) => {
        document.getElementById("status").innerText = "Approbation via serveur...";
        const res = await callWorker(paymentId, "approve");
        document.getElementById("status").innerText = "Approuvé ! "+res;
      },
      onReadyForServerCompletion: async (paymentId, txid) => {
        document.getElementById("status").innerText = "Finalisation...";
        const res = await callWorker(paymentId, "complete", txid);
        document.getElementById("status").innerText = "✅ COMPLETED VERT ! Commande enregistrée ! "+res;
      },
      onCancel: () => { document.getElementById("status").innerText = "Paiement annulé"; },
      onError: (e) => { document.getElementById("status").innerText = "Erreur: "+e.message; }
    });
  }catch(e){ document.getElementById("status").innerText = "Erreur: "+e.message; }
};
</script>
</body>
</html>
