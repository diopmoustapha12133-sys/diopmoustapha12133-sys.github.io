<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>Diop Chop Café Touba</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:Arial;text-align:center;padding:20px;background:#fdf6e3}
.card{background:white;padding:20px;border-radius:15px;max-width:350px;margin:auto;box-shadow:0 4px 10px #ccc}
button{width:100%;padding:15px;margin:10px 0;border:none;border-radius:10px;font-size:18px;font-weight:bold}
.btn-pi{background:#8B4513;color:white}
.btn-wave{background:#00d4ff;color:white}
</style>
</head>
<body>
<div class="card">
<h1>☕ Diop Chop Café Touba</h1>
<p>Bienvenue</p>
<hr>
<p><b>Café Touba:</b> 500F / 0.1 Pi</p>
<p><b>Thiéré + Café:</b> 1500F / 0.3 Pi</p>
<button class="btn-pi" onclick="payerPi(0.1)">Payer en Pi</button>
<button class="btn-wave" onclick="alert('Wave bientôt')">Payer Wave</button>
<p id="status"></p>
</div>

<script>
Pi.init({ version: "2.0", sandbox: true });

function onIncompletePaymentFound(payment) {
  console.log("Paiement incomplet trouvé", payment);
  return Pi.completePayment(payment.identifier);
}

async function payerPi(montant) {
  document.getElementById('status').innerText = "Connexion...";
  try {
    const scopes = ['payments', 'username'];
    const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
    
    const payment = await Pi.createPayment({
      amount: montant,
      memo: "Cafe Touba Diop Chop",
      metadata: { commande: "cafe_touba", prix: montant, boutique: "diop_chop" }
    }, {
      onReadyForServerApproval: function(paymentId) {
        console.log("Approval", paymentId);
        document.getElementById('status').innerText = "Approbation...";
        // Pour le testnet, on approuve directement côté client
        fetch(`https://api.testnet.minepi.com/v2/payments/${paymentId}/approve`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${Pi.accessToken}` }
        });
      },
      onReadyForServerCompletion: function(paymentId, txid) {
        console.log("Completion", paymentId, txid);
        document.getElementById('status').innerText = "Paiement validé ! " + txid;
        fetch(`https://api.testnet.minepi.com/v2/payments/${paymentId}/complete`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${Pi.accessToken}` },
          body: JSON.stringify({ txid: txid })
        });
        alert("Paiement réussi ! Retourne dans Develop pour valider l'étape 6");
      },
      onCancel: function(paymentId) {
        document.getElementById('status').innerText = "Annulé";
      },
      onError: function(error, payment) {
        document.getElementById('status').innerText = "Erreur: " + error.message;
        console.log(error);
      }
    });
  } catch(e) {
    document.getElementById('status').innerText = "Erreur: " + e.message;
  }
}
</script>
</body>
</html>
